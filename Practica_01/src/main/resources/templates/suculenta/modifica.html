<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: head}"></head>
<body class="d-flex flex-column min-vh-100">

    <nav th:replace="~{fragmentos :: menu}"></nav>

    <main class="container my-4 flex-grow-1">

        <h1 class="text-success"
            th:text="${suculenta.idSuculenta} != null ? 'Editar suculenta' : 'Nueva suculenta'">
            Suculenta
        </h1>

        <div class="row">
            <div class="col-lg-8">
                <form th:action="@{/suculenta/guardar}" th:object="${suculenta}" method="post">

                    <!-- El id se envia oculto para diferenciar crear de actualizar -->
                    <input type="hidden" th:field="*{idSuculenta}">

                    <div class="mb-3">
                        <label class="form-label">Nombre comun</label>
                        <input type="text" class="form-control" th:field="*{nombreComun}">
                        <div class="text-danger small" th:if="${#fields.hasErrors('nombreComun')}"
                             th:errors="*{nombreComun}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Nombre cientifico</label>
                        <input type="text" class="form-control" th:field="*{nombreCientifico}">
                        <div class="text-danger small" th:if="${#fields.hasErrors('nombreCientifico')}"
                             th:errors="*{nombreCientifico}"></div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Familia</label>
                            <input type="text" class="form-control" th:field="*{familia}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Color principal</label>
                            <input type="text" class="form-control" th:field="*{colorPrincipal}">
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Altura (cm)</label>
                            <input type="number" class="form-control" th:field="*{alturaCm}">
                            <div class="text-danger small" th:if="${#fields.hasErrors('alturaCm')}"
                                 th:errors="*{alturaCm}"></div>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Precio estimado</label>
                            <input type="number" step="0.01" class="form-control" th:field="*{precioEstimado}">
                            <div class="text-danger small" th:if="${#fields.hasErrors('precioEstimado')}"
                                 th:errors="*{precioEstimado}"></div>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Nivel de riego</label>
                            <select class="form-select" th:field="*{nivelRiego}">
                                <option value="">Seleccione...</option>
                                <option value="Bajo">Bajo</option>
                                <option value="Medio">Medio</option>
                                <option value="Alto">Alto</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">URL de la imagen (en la nube)</label>
                        <input type="url" class="form-control" th:field="*{rutaImagen}"
                               placeholder="https://...">
                        <div class="text-danger small" th:if="${#fields.hasErrors('rutaImagen')}"
                             th:errors="*{rutaImagen}"></div>
                    </div>

                    <div class="form-check mb-3">
                        <input type="checkbox" class="form-check-input" th:field="*{activo}">
                        <label class="form-check-label">Activo (visible en el catalogo)</label>
                    </div>

                    <button type="submit" class="btn btn-success">Guardar</button>
                    <a th:href="@{/suculenta/listado}" class="btn btn-secondary">Cancelar</a>
                </form>
            </div>

            <!-- Vista previa de la imagen -->
            <div class="col-lg-4">
                <div class="card" th:if="*{rutaImagen} != null and *{rutaImagen} != ''">
                    <img th:src="*{rutaImagen}" class="card-img-top" alt="Vista previa"
                         style="height: 250px; object-fit: cover;">
                    <div class="card-body">
                        <small class="text-muted">Vista previa de la imagen</small>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragmentos :: footer}"></footer>
    <div th:replace="~{fragmentos :: scripts}"></div>
</body>
</html>
