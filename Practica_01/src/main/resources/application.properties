spring.application.name=practica01

# El servidor web escucha por el puerto 91 (requerido por la practica)
server.port=91

# Se elimina el banner de Spring del log
spring.main.banner-mode=off

# En desarrollo no se usa cache de Thymeleaf
spring.thymeleaf.cache=false

# --- Conexion a la base de datos practica en MySQL ---
spring.datasource.url=jdbc:mysql://localhost:3306/practica
spring.datasource.username=usuario_practica
spring.datasource.password=la_Clave
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# --- Bitacora (logging) a nivel TRACE ---
logging.level.root=trace
# Formato del log: dia del mes, hora y minuto
logging.pattern.dateformat=dd HH:mm

# Mostrar y formatear el SQL generado por Hibernate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
