<!-- Fragmento 1, el HEAD -->
<head th:fragment="head">
    <title>[[#{aplicacion.titulo}]]</title>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <!-- Bootstrap (CSS y JS bundle con Popper, para usar todas sus caracteristicas) -->
    <link th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}" rel="stylesheet"/>
    <script th:src="@{/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js}"></script>
    <!-- Archivo de rutinas propias del caso -->
    <script th:src="@{/js/rutinas.js}"></script>
</head>

<!-- Fragmento 2, el HEADER -->
<header th:fragment="header" class="header">
    <nav class="navbar navbar-expand-sm bg-dark navbar-dark">
        <div class="container">
            <a th:href="@{/}" class="navbar-brand">[[#{aplicacion.titulo}]]</a>
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/cleta/listado}">[[#{cleta.listado}]]</a>
                </li>
            </ul>
        </div>
    </nav>
</header>

<!-- Fragmento 3, el FOOTER -->
<footer th:fragment="footer" class="p-2 mt-5 bg-dark text-white">
    <p class="lead text-center">[[#{nombre.estudiante}]]</p>
</footer>
